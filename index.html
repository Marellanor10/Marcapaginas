<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcapáginas</title>
<meta name="description" content="Registro de lectura: qué estás leyendo, qué ya leíste y qué quieres leer.">
<meta name="theme-color" content="#16242B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marcapáginas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Marcapáginas</div>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-action="tab" data-tab="reading">Leyendo<span class="count" id="c-reading"></span></button>
      <button class="tab" data-action="tab" data-tab="read">Leídos<span class="count" id="c-read"></span></button>
      <button class="tab" data-action="tab" data-tab="want">Quiero leer<span class="count" id="c-want"></span></button>
      <button class="tab" data-action="tab" data-tab="stats">Resumen</button>
    </nav>
    <button class="icon-btn" data-action="search" aria-label="Buscar"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
